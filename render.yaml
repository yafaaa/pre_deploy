services:
  - type: web
    name: network-app
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn project4.wsgi:application"
    plan: free
    region: oregon
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: network-db
          property: connectionString

databases:
  - name: network-db
    plan: free
    region: oregon
